<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>FitQuest AI — Move. Compete. Improve.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="loading-screen">
  <div class="boot-mark">F</div>
  <div class="boot-name">FITQUEST AI</div>
  <div class="boot-tag">MOVE. COMPETE. IMPROVE.</div>
  <div class="boot-dots"><i></i><i></i><i></i></div>
</div>

<div id="toast-wrap"></div>

<!-- ================= SUGGESTION BOX ================= -->
<div class="suggest-popup hidden" id="suggest-popup">
  <span class="close-info" onclick="toggleSuggestPopup()" style="position:absolute;top:10px;right:12px;font-size:16px;color:var(--muted);cursor:pointer;">✕</span>
  <h4>💡 Suggest a Feature</h4>
  <p style="margin-bottom:10px;">What should we improve or add next? Saved on this device.</p>
  <textarea id="suggest-input" class="suggest-textarea" placeholder="e.g. Add a running tracker..." maxlength="500"></textarea>
  <button class="btn btn-volt btn-sm" style="width:100%;" onclick="submitSuggestion()">Submit Suggestion</button>
  <div id="suggest-list"></div>
</div>

<!-- ================= DRAWER MENU ================= -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="brand-inline" style="display:flex;align-items:center;gap:8px;">
      <div class="brand-mark" style="width:28px;height:28px;border-radius:7px;font-size:14px;">F</div>
      <div>
        <div class="brand-name display" style="font-size:15px;">FITQUEST</div>
        <div class="brand-tag">AI</div>
      </div>
    </div>
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
  </div>
  <nav class="drawer-nav" id="drawer-nav-list"></nav>
  <div class="drawer-foot">
    <div class="avatar-sm" id="drawer-avatar">A</div>
    <div>
      <div class="side-foot-name" id="drawer-name">Athlete</div>
      <div class="side-foot-lvl" id="drawer-level">Level 1</div>
    </div>
  </div>
</div>

<!-- ================= AUTH ================= -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name display">FITQUEST AI</div>
        <div class="brand-tag">MOVE. COMPETE. IMPROVE.</div>
      </div>
    </div>
    <div id="auth-card-holder"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden" style="flex-direction:column;">

  <!-- ── TOP BAR (always visible when logged in, on both PC + mobile) ── -->
  <div class="app-topbar" id="app-topbar">
    <div class="topbar-left">
      <!-- ← Back — previous page (browser back works too) -->
      <button class="hamburger-btn hidden" id="back-btn" onclick="goBack()" title="Back" aria-label="Go back" style="margin-right:2px;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <!-- ☰ Hamburger — opens drawer on both PC and mobile -->
      <button class="hamburger-btn" onclick="openDrawer()" title="Menu" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-brand">
        <div class="topbar-brand-mark">F</div>
        <div class="topbar-brand-name display">FITQUEST AI</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-pill">
        <button class="premium-nav-btn" id="premium-nav-btn" onclick="setView('premium')" title="Premium Features">
          <span class="premium-nav-shine"></span>
          <span class="premium-nav-icon">👑</span><span class="premium-nav-label">Premium</span>
        </button>
        <button class="pill-icon-btn" id="theme-pill-btn" onclick="toggleThemePill()" title="Toggle dark / light">🌙</button>
        <button class="pill-icon-btn" id="suggest-pill-btn" onclick="toggleSuggestPopup()" title="Suggest a feature">💡</button>
      </div>
      <!-- Profile avatar (right corner) — opens Profile / Forget Password / Logout -->
      <div class="profile-menu-wrap" id="profile-menu-wrap">
        <button class="avatar-btn" id="topbar-avatar" onclick="toggleProfileMenu()" title="Account">A</button>
        <div class="profile-dropdown" id="profile-dropdown"></div>
      </div>
    </div>
  </div>

  <!-- ── CONTENT ROW (sidebar + main) ── -->
  <div style="display:flex;flex:1;min-height:0;overflow:hidden;">
    <div class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div>
          <div class="brand-name display">FITQUEST</div>
          <div class="brand-tag">AI</div>
        </div>
      </div>
      <nav class="nav" id="nav-list"></nav>
      <div class="side-foot">
        <div class="avatar-sm" id="side-avatar">A</div>
        <div>
          <div class="side-foot-name" id="side-name">Athlete</div>
          <div class="side-foot-lvl" id="side-level">Level 1</div>
        </div>
      </div>
    </div>

    <div class="main" id="main-content" style="overflow-y:auto;flex:1;">
      <div id="view-dashboard" class="view"></div>
      <div id="view-coach" class="view"></div>
      <div id="view-library" class="view"></div>
      <div id="view-yoga" class="view"></div>
      <div id="view-nutrition" class="view"></div>
      <div id="view-challenges" class="view"></div>
      <div id="view-leaderboard" class="view"></div>
      <div id="view-progress" class="view"></div>
      <div id="view-premium" class="view"></div>
      <div id="view-paywall" class="view"></div>
      <div id="view-assistant" class="view"></div>
      <div id="view-trainer" class="view"></div>
      <div id="view-checkout" class="view"></div>
      <div id="view-profile" class="view"></div>
      <div id="view-xpstore" class="view"></div>
      <div id="view-delete" class="view"></div>
      <div id="view-forgot" class="view"></div>
    </div>
  </div>
</div>

<!-- Bottom nav — rendered here, shown only on mobile -->
<div class="bottom-nav" id="bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

    <script src="/app.js"></script>
    <script src="/clips.js"></script>
</body>
</html>
